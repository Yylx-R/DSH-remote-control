name: ${COMPOSE_PROJECT_NAME:-dsh-console}

# 两种用法：
#   源码部署：docker compose up -d --build
#   镜像部署：在 .env 里设 RELAY_IMAGE=ghcr.io/<owner>/dsh-console-relay:latest
#            docker compose pull && docker compose up -d
#
# 有域名（自动 HTTPS）：docker compose --profile tls up -d --build
# 没域名（HTTP 直连）：  docker compose -f docker-compose.yml -f docker-compose.direct.yml up -d --build

services:
  relay:
    image: ${RELAY_IMAGE:-dsh-console-relay:local}
    build:
      context: ../relay
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: "/data"
      BLOB_MAX_MB: "${BLOB_MAX_MB:-50}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      NODE_ENV: production
    expose:
      - "8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      relay:
        condition: service_started
    networks:
      - edge

networks:
  edge:
    driver: bridge
