name: dsh-remote

services:
  relay:
    build: ./relay
    restart: unless-stopped
    environment:
      PORT: "8787"
      PUBLIC_URL: "https://${DOMAIN}"
      NODE_ENV: production
    expose:
      - "8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      relay:
        condition: service_started
    networks:
      - edge

networks:
  edge:
    driver: bridge
